<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Conversor de monedas</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="container">

    <h1>Conversor de pesos chilenos</h1>
    <div class="dcon">
        <h3>Pesos CLP</h3>
        <input id="pesos" type="number" placeholder="Ingrese el monto en CLP" class="btninput">
        <h6>Moneda a convertir:</h6>
        <select id="moneda" class="btnmoneda">
            <option value="Seleccionar">Seleccionar moneda</option>
            <option value="dolar">Dólar</option>
            <option value="euro">Euro</option>
            <option value="uf">UF</option>
            <option value="bitcoin">Bitcoin</option>
        </select>
        <button onclick="convertir()" class="btnbuscar">Buscar</button>

        <p id="resultado"></p>
    </div>
    <canvas id="grafico" width="100" height="50" style="background-color: #fff;"></canvas>

    <script>
        let datosMonedas = {};
        let grafico;


        fetch("mindicador.json")
            .then(res => res.json())
            .then(data => {
                datosMonedas = data;
                console.log("Datos cargados:", datosMonedas);
            })
            .catch(error => {
                console.log("Error al cargar JSON:", error);
            });

        function convertir() {
            let pesos = document.getElementById("pesos").value;
            let moneda = document.getElementById("moneda").value;

            if (pesos === "" || pesos <= 0) {
                document.getElementById("resultado").innerText = "Debes ingresar un monto válido.";
                return;
            }


            let valorMoneda = datosMonedas[moneda].valor;
            let conversion = (pesos / valorMoneda).toFixed(2);

            document.getElementById("resultado").innerText = pesos + " CLP = " + conversion + " " + moneda.toUpperCase();


            let labels = [];
            let valores = [];

            for (let i = 1; i <= 10; i++) {
                labels.push("Día " + i);

                let variacion = valorMoneda * (0.95 + Math.random() * 0.1);
                valores.push(variacion.toFixed(2));
            }

            if (grafico) {
                grafico.destroy();
            }

            grafico = new Chart(document.getElementById("grafico"), {
                type: "line",
                data: {
                    labels: labels,
                    datasets: [{
                        label: "Historial " + moneda,
                        data: valores,
                        borderColor: "green",
                        fill: false
                    }]
                }
            });
        }
    </script>
</body>

</html>
